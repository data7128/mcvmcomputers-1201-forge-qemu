name: 1.20.1 Forge Jar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mod:
    name: 打包 1.20.1 Forge mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: forge1201-${{ runner.os }}-${{ hashFiles('gradle.properties', 'build.gradle') }}

      - name: Verify bundled QEMU binaries
        run: |
          ls -lh src/main/resources/assets/qemu/
          file src/main/resources/assets/qemu/*

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon

      - name: List jars
        run: ls -lh build/libs/

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: mod-forge-1201-qemu
          path: build/libs/*.jar
          if-no-files-found: error
